<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">{{ data.cancelLabel ?? 'Annuler' }}</button>
  <button
    mat-flat-button
    type="button"
    [class.danger]="data.danger"
    cdkFocusInitial
    (click)="confirm()"
  >
    {{ data.confirmLabel ?? 'Confirmer' }}
  </button>
</mat-dialog-actions>
